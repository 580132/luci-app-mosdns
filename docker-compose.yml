services:
  mosdns:
    build: .
    image: mosdns:5.3.4
    container_name: mosdns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "8080:8080/tcp"   # stats dashboard (standalone replacement for LuCI statistics page)
      # - "9091:9091/tcp"  # raw stats_api endpoint, uncomment if needed
    environment:
      LISTEN_ADDR: "0.0.0.0"
      LISTEN_PORT: "53"
      # API_LISTEN: "0.0.0.0:9091"
      LOG_LEVEL: "info"
      # LOG_FILE: "/var/log/mosdns.log"  # default "" -> stderr (docker logs)
      GEO_AUTO_UPDATE: "1"
      GEOIP_TYPE: "geoip-only-cn-private"
      # GITHUB_PROXY: "https://gh-proxy.com/"
      # GEOSITE_TAGS: "apple,netflix"
      # --- ad blocking (port of LuCI adblock/ad_source) ---
      # ADBLOCK: "1"
      # AD_SOURCES: "geosite.dat https://anti-ad.net/easylist.txt file:///etc/mosdns/rule/my-ads.txt"
      # --- background refresh: geo + adlist, zero-downtime via file watcher ---
      # AUTO_UPDATE: "1"             # 0 = only refresh at container start
      # UPDATE_CHECK_INTERVAL: "86400"  # loop cadence + ad re-download threshold;
                                      # 0 = disable loop (missing files still fetched)
      # Manual trigger without restart:
      #   docker exec mosdns update-data
    volumes:
      # Persist config/rules/geo across recreates; comment out to use image defaults.
      - ./docker/config.yaml:/etc/mosdns/config.yaml:ro
      - mosdns-rules:/etc/mosdns/rule
      - mosdns-geo:/usr/share/v2ray
      - mosdns-txt:/var/lib/mosdns
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosdns-rules:
  mosdns-geo:
  mosdns-txt:
